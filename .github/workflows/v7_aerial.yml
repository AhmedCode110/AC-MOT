name: Frozen V7f on VisDrone (val-7, confirmation-16, test-dev)
on:
  workflow_dispatch:
  push:
    branches: [universal-adapters-v1-y0zkeh]
    paths: [".github/workflows/v7_aerial.yml", "tools/v7/ci/aerial_v7f.sh"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Run
        run: bash tools/v7/ci/aerial_v7f.sh
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/final/aerial_v7f || true
          git add -f JAIS_PAPERS/PAPER1_SCENE_ADAPTIVE_JAIS/figures/scene_frames || true
          git diff --cached --quiet && exit 0
          git commit -m "Frozen V7f on VisDrone val-7 / confirmation-16 / test-dev (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase origin universal-adapters-v1-y0zkeh && git push origin HEAD:universal-adapters-v1-y0zkeh && break; sleep 5; done
