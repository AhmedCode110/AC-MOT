name: TrackTrack + frozen V7f (DanceTrack val)
on:
  workflow_dispatch:
  push:
    branches: [universal-adapters-v1-y0zkeh]
    paths: [".github/workflows/recent_tracktrack.yml", "tools/v7/recent/tracktrack_track_job.sh", "tools/v7/recent/tracktrack_feats_job.sh"]
permissions:
  contents: write
jobs:
  feats:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        g: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Features
        run: bash tools/v7/recent/tracktrack_feats_job.sh ${{ matrix.g }} 5 $HOME/feat_out
      - uses: actions/upload-artifact@v4
        with:
          name: feats-${{ matrix.g }}
          path: ~/feat_out
  track:
    needs: feats
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ~/feats
      - name: Track and evaluate
        run: bash tools/v7/recent/tracktrack_track_job.sh $HOME/feats
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/final/recent/tracktrack || true
          git diff --cached --quiet && exit 0
          git commit -m "TrackTrack + frozen V7f: DanceTrack val results (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase origin universal-adapters-v1-y0zkeh && git push origin HEAD:universal-adapters-v1-y0zkeh && break; sleep 5; done
