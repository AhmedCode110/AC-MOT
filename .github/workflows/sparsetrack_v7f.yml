name: SparseTrack + frozen V7f (MOT17 val-half)
on:
  workflow_dispatch:
  push:
    branches: [universal-adapters-v1-y0zkeh]
    paths: [".github/workflows/sparsetrack_v7f.yml", "tools/v7/ci/sparsetrack_v7f.sh"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopencv-dev pkg-config g++ unzip
      - name: Run
        run: bash tools/v7/ci/sparsetrack_v7f.sh
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/final/sparsetrack_v7f
          git diff --cached --quiet && exit 0
          git commit -m "SparseTrack + frozen V7f on MOT17 val-half (CI run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase origin universal-adapters-v1-y0zkeh && git push origin HEAD:universal-adapters-v1-y0zkeh && break; sleep 5; done
