name: TrackTrack + frozen V7f (DanceTrack val) - tracking from saved features
on:
  workflow_dispatch:
    inputs:
      feats_run_id:
        description: run id of recent_tracktrack.yml whose feats-* artifacts are reused
        default: "36487286878"
  push:
    branches: [universal-adapters-v1-y0zkeh]
    paths: [".github/workflows/recent_tracktrack_track.yml"]
permissions:
  contents: write
  actions: read
jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ~/feats
          pattern: feats-*
          run-id: ${{ github.event.inputs.feats_run_id || '36487286878' }}
          github-token: ${{ github.token }}
      - name: Track and evaluate
        run: bash tools/v7/recent/tracktrack_track_job.sh $HOME/feats
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/final/recent/tracktrack || true
          git diff --cached --quiet && exit 0
          git commit -m "TrackTrack + frozen V7f: DanceTrack val results (run ${GITHUB_RUN_ID}, features of run ${{ github.event.inputs.feats_run_id || '36487286878' }})"
          for i in 1 2 3; do git pull --rebase origin universal-adapters-v1-y0zkeh && git push origin HEAD:universal-adapters-v1-y0zkeh && break; sleep 5; done
